
  <!DOCTYPE html>
  <html lang="de" class="dark">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="theme-color" content="#0A0A0D" />

      <!-- Google Search Console verification (URL-prefix property). Public token. -->
      <meta name="google-site-verification" content="J4NtdWHZsd1fcWv-RLUX4FkM-V80dMHdcDDVmP2Q2N0" />

      <!-- Fonts are SELF-HOSTED (public/fonts, @font-face in
           src/styles/fonts.css, regenerate with `pnpm fonts`). The previous
           <link> to fonts.googleapis.com was a render-blocking stylesheet on a
           third origin — DNS + TCP + TLS before the browser even learned which
           .woff2 to fetch — and it sent every visitor's IP to Google (DSGVO).
           Preloading the two latin subsets here starts them in parallel with
           the bundled CSS instead of after it. -->
      <link rel="preload" href="/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />

      <!-- Kept in sync with HOME_META in src/app/seo.ts — the build stamps the
           values from there into dist/index.html, this is the dev-time copy. -->
      <title>Social Media Agentur Meschede &amp; Sauerland — Puron Media</title>
      <meta name="description" content="Puron Media aus Meschede produziert Reels, Posts, Ads und Content-Strategien, die Unternehmen Kunden, Bewerber und langfristige Aufmerksamkeit gewinnen lassen." />

      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <link rel="manifest" href="/manifest.webmanifest" />
      <link rel="canonical" href="https://puron-media.de/" />
      <link rel="apple-touch-icon" href="/logo.png" />

      <!-- Open Graph -->
      <meta property="og:type" content="website" />
      <meta property="og:locale" content="de_DE" />
      <meta property="og:url" content="https://puron-media.de/" />
      <meta property="og:site_name" content="Puron Media" />
      <meta property="og:title" content="Puron Media — Social Media Content, das Unternehmen sichtbar macht" />

      <meta property="og:image" content="https://puron-media.de/og-image.png" />
      <meta property="og:image:width" content="1200" />
      <meta property="og:image:height" content="630" />
      <meta property="og:image:alt" content="Puron Media – Social Media Content, der funktioniert" />

      <!-- Twitter Card -->
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="Puron Media" />
      <meta name="twitter:description" content="Social Media Content, das Unternehmen sichtbar macht." />
      <meta name="twitter:image" content="https://puron-media.de/og-image.png" />

      <!-- Structured data (JSON-LD): local-business / professional-service info
           for richer search results + local SEO. A type="application/ld+json"
           block is data, not executable script, so the strict CSP script-src
           does not apply to it. -->
      <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "ProfessionalService",
          "@id": "https://puron-media.de/#organization",
          "name": "Puron Media",
          "alternateName": "Puron Media Meschede",
          "url": "https://puron-media.de/",
          "logo": "https://puron-media.de/logo.png",
          "image": "https://puron-media.de/logo.png",
          "description": "Social-Media-Agentur aus Meschede: Reels, Posts, Ads und Content-Strategien, die Unternehmen Kunden, Bewerber und langfristige Sichtbarkeit gewinnen lassen.",
          "email": "info@puron-media.de",
          "telephone": "+49 163 8843453",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Birmecker Weg 20",
            "postalCode": "59872",
            "addressLocality": "Meschede",
            "addressRegion": "Nordrhein-Westfalen",
            "addressCountry": "DE"
          },
          "areaServed": [
            { "@type": "Country", "name": "Deutschland" },
            { "@type": "AdministrativeArea", "name": "Hochsauerlandkreis" },
            { "@type": "City", "name": "Meschede" }
          ],
          "knowsLanguage": ["de"],
          "sameAs": ["https://www.instagram.com/puronmedia"],
          "founder": { "@type": "Person", "name": "Mahsuni Akdemir" },
          "priceRange": "€€",
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Leistungen",
            "itemListElement": [
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Reels", "description": "Konzeption, Dreh und Schnitt vertikaler Videos für Instagram Reels, TikTok und YouTube Shorts." } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Social-Media-Beiträge", "description": "Einzelbild-Posts und Multi-Slide-Karussells inklusive Caption- und Hashtag-Strategie." } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Ads", "description": "Werbemittel für Meta, Google und LinkedIn inklusive A/B-Testing und Performance-Reporting." } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Content-Strategie", "description": "Zielgruppenanalyse, Content-Säulen und monatliche Content-Pläne." } }
            ]
          }
        }
      </script>

      <style>html, body { height: 100%; margin: 0; background: #0A0A0D; } #root { height: 100%; }</style>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
